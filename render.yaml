# Render Blueprint for the Django API (native Python runtime, free plan).
# Values marked "sync: false" are prompted for when the Blueprint is first created;
# fill in the frontend URLs after the Vercel project exists, then redeploy.
services:
  - type: web
    name: earth-observation-api
    runtime: python
    plan: free
    rootDir: backend
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn geoanalysis.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 300
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.15
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EARTH_ENGINE_PROJECT
        sync: false
      - key: EARTH_ENGINE_SERVICE_ACCOUNT_KEY_BASE64
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
